name: Build macOS app

# Run by hand (Actions tab > Build macOS app > Run workflow, or `gh workflow run mac.yml`),
# or by pushing to the mac-build branch.
on:
  workflow_dispatch:
  push:
    branches: [mac-build]

jobs:
  build:
    runs-on: macos-15          # Apple Silicon
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build, smoke-test and package
        run: python build_mac.py
        env:
          GH_TOKEN: ${{ github.token }}   # the update-check test would otherwise share the runner's anonymous rate limit

      - uses: actions/upload-artifact@v5
        with:
          name: dl_transcribe-mac-apple-silicon
          path: dist/MacOS/*.dmg
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-output
          path: |
            build-mac/screenshots/
            build-mac/smoke/out/
            build-mac/smoke/*.json
            build-mac/smoke/*.pdf
          retention-days: 14
